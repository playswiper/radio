<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swiper Radio · Aqua Wave</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet"><style>:root{--a:#9de8ff;--b:#123448}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,var(--b),#080b10 68%);font-family:Fredoka,sans-serif;color:#f5f7fb;padding:20px}.stage{text-align:center;width:min(100%,620px)}.label{color:#8594a7;font-size:11px;letter-spacing:2px;margin-bottom:26px}.open{position:relative;margin:auto;display:flex;align-items:center;justify-content:center;gap:15px;width:230px;height:94px;border:1px solid #9de8ff77;background:linear-gradient(145deg,var(--b),#0d1219);color:white;border-radius:18px 50px 18px 50px;box-shadow:0 12px 42px #0008;cursor:pointer;overflow:hidden;transition:.4s}.open:hover,.open:focus-visible{width:min(100%,470px);height:174px;border-radius:22px;transform:translateY(-5px);box-shadow:0 22px 65px #0009,0 0 40px #48c8f566;outline:none}.orb{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#09111b;font-size:23px;transition:.4s}.open:hover .orb{transform:rotate(18deg) scale(1.12)}.word{font-size:22px;font-weight:600;white-space:nowrap}.detail{position:absolute;left:20px;right:20px;bottom:15px;opacity:0;transform:translateY(12px);transition:.35s;pointer-events:none;text-align:left}.open:hover .detail,.open:focus-visible .detail{opacity:1;transform:translateY(0)}.row{display:flex;align-items:center;gap:12px}.art{width:46px;height:46px;object-fit:cover;border-radius:10px}.meta{min-width:0;flex:1}.title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:#a3afbd}.left{font-size:11px;color:#aab7c7;white-space:nowrap}.bar{height:3px;background:#344150;margin-top:10px}.bar span{display:block;height:100%;width:0;background:var(--a)}.times{display:flex;justify-content:space-between;color:#9aa8b7;font-size:10px;margin-top:5px}.caption{margin-top:28px;color:#8391a2;font-size:13px}.back{display:inline-block;margin-top:22px;color:#9ecaff;text-decoration:none}</style></head><body><main class="stage"><div class="label">Swiper Radio · Button concept 10 / 10</div><button class="open" id="open"><span class="orb">▶</span><span class="word">Open Radio</span><span class="detail"><span class="row"><img class="art" id="art"><span class="meta"><span class="title" id="title">Loading live track…</span><br><span class="artist" id="artist">Swiper Radio</span></span><span class="left" id="left">--:-- left</span></span><span class="bar"><span id="bar"></span></span><span class="times"><span id="elapsed">0:00</span><span id="total">0:00 total</span></span></span></button><div class="caption">Aqua Wave · Hover or focus to reveal live song, artist, elapsed time and duration.</div><a class="back" href="index.html">← Back to Swiper Radio</a></main><script>(()=>{const U='https://upghyzhawctughyojwpo.supabase.co',K='sb_publishable_z70GOIzu3F_xdxdJiVa48A_SqvrA6-b';let t=null,s=null;const $=x=>document.getElementById(x),f=n=>Math.floor(Math.max(0,n)/60)+':'+String(Math.floor(Math.max(0,n)%60)).padStart(2,'0');async function load(){try{let h={apikey:K,Authorization:'Bearer '+K},r=await fetch(U+'/rest/v1/radio_station?select=current_track_id,started_at&id=eq.1',{headers:h}).then(x=>x.json());if(!r[0])return;s=r[0].started_at;t=(await fetch(U+'/rest/v1/radio_tracks?select=*&id=eq.'+r[0].current_track_id,{headers:h}).then(x=>x.json()))[0];if(!t)return;$('title').textContent=t.title;$('artist').textContent=t.artist;$('art').src=t.artwork_url||'';$('total').textContent=f(t.duration_seconds)+' total'}catch(e){$('title').textContent='Live track unavailable'}}function tick(){if(!t||!s)return;let e=Math.max(0,(Date.now()-new Date(s).getTime())/1000),d=t.duration_seconds||0;$('elapsed').textContent=f(e);$('left').textContent=f(d-e)+' left';$('bar').style.width=(d?Math.min(100,e/d*100):0)+'%'}$('open').onclick=()=>location.href='index.html';load().then(tick);setInterval(()=>load().then(tick),15000);setInterval(tick,1000)})();</script></body></html>
