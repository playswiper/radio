<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>Swiper Image Library</title>
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/FalviconMainImage.jpeg?v=20261119-1">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/FalviconMainImage.jpeg?v=20261119-1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#151b27;--line:#2b3547;--text:#f4f7ff;--muted:#9aa8bd;--accent:#80baff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Fredoka,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}h1{font-size:clamp(24px,4vw,34px);margin:0}.sub{color:var(--muted);margin:3px 0 0}.back{color:#b9d8ff;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#151b27}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.searchrow{display:flex;gap:9px}.searchrow input{width:100%;min-width:0;background:#0c111a;border:1px solid #354257;border-radius:12px;color:white;padding:13px 14px;font:inherit;outline:none}.searchrow input:focus{border-color:#80baff;box-shadow:0 0 0 3px #80baff20}.count{color:var(--muted);font-size:12px;margin:12px 2px 0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.filters button{border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:#0d131d;color:#aebbd0;font:inherit}.filters button.active{background:#22354b;border-color:#6089b5;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:13px}.item{min-width:0;overflow:hidden;background:#141b27;border:1px solid var(--line);border-radius:16px}.preview{height:175px;background:#0a0e15;display:grid;place-items:center;padding:12px}.preview img{width:100%;height:100%;object-fit:contain}.info{padding:12px}.name{font-weight:650;overflow-wrap:anywhere}.path{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px;min-height:30px}.tag{display:inline-block;margin-top:8px;border:1px solid #35465c;background:#1a2635;border-radius:30px;padding:3px 8px;color:#b8d5f5;font-size:10px;text-transform:uppercase;letter-spacing:.7px}.actions{display:flex;gap:7px;margin-top:11px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:1px solid #35465c;background:#202c3c;color:#eef5ff;border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer}.empty{padding:36px 12px;text-align:center;color:var(--muted);border:1px dashed #354257;border-radius:14px}.loading{color:var(--muted);padding:25px;text-align:center}.error{color:#ffb5c1}.foot{text-align:center;color:#69788e;font-size:11px;margin-top:24px}
@media(max-width:560px){.wrap{padding-top:15px}.top{align-items:flex-start}.brand img{width:42px;height:42px}.back{font-size:12px;padding:8px 10px}.panel{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.preview{height:135px}.info{padding:9px}.actions{gap:5px}.actions a,.actions button{font-size:11px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><img src="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/Swiper%20Image%20Logo.jpg" alt="Swiper logo"><div><h1>Image Library</h1><p class="sub">Shared Swiper image, icon and logo library</p></div></div><a class="back" href="https://radio.playswiper.com/bigscreen.html">← Swiper</a></header>
<section class="panel"><div class="searchrow"><input id="search" type="search" placeholder="Search filenames, folders, logos…" autocomplete="off" aria-label="Search the complete image library"></div><div class="filters" id="filters"><button class="active" data-filter="all">Everything</button><button data-filter="logo">Logos</button><button data-filter="icon">Icons &amp; favicons</button><button data-filter="other">Other images</button></div><div class="count" id="count">Discovering image assets…</div></section>
<div id="grid" class="grid"><div class="loading">Loading the complete image library…</div></div><div class="foot">Images are loaded directly from the Swiper GitHub image library.</div>
</div><script>
(()=>{'use strict';
const OWNER='playswiper',REPO='Swiper',BRANCH='main',API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/'+BRANCH+'?recursive=1',RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/';
const known=['Images/ChatIcon.jpeg','Images/FalviconMainImage.jpeg','Images/Swiper Image Logo.jpg','Images/More Images/QuickWordsBeta.jpeg','Images/More Images/QuickWordsInfoBeta.jpeg','favicon.svg'];
const $=id=>document.getElementById(id);let assets=[],filter='all';
const imageExt=/\.(apng|avif|gif|jpe?g|png|svg|webp|ico)$/i;
const classify=p=>{const n=p.split('/').pop().toLowerCase();if(/logo|brand|wordmark/.test(n))return'logo';if(/icon|favicon|favl?icon|badge/.test(n))return'icon';return'other'};
const url=p=>RAW+p.split('/').map(encodeURIComponent).join('/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.trim().toLowerCase();const shown=assets.filter(a=>(filter==='all'||a.kind===filter)&&(a.path+' '+a.name+' '+a.kind).toLowerCase().includes(q));$('count').textContent=shown.length+' of '+assets.length+' image assets'+(q?' matching “'+q+'”':'');$('grid').innerHTML=shown.length?shown.map(a=>{const src=url(a.path);return '<article class="item"><div class="preview"><img loading="lazy" decoding="async" src="'+esc(src)+'" alt="'+esc(a.name)+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\'Preview unavailable\'"></div><div class="info"><div class="name">'+esc(a.name)+'</div><div class="path">'+esc(a.path)+'</div><span class="tag">'+esc(a.kind==='icon'?'Icon / favicon':a.kind)+'</span><div class="actions"><a href="'+esc(src)+'" target="_blank" rel="noopener">Open image</a><button type="button" data-copy="'+esc(src)+'">Copy URL</button></div></div></article>'}).join(''):'<div class="empty">No images match that search. Try a different name or choose Everything.</div>'}
async function load(){try{const response=await fetch(API,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw new Error('GitHub returned '+response.status);const data=await response.json();assets=(data.tree||[]).filter(x=>x.type==='blob'&&imageExt.test(x.path)).map(x=>({path:x.path,name:x.path.split('/').pop(),kind:classify(x.path)})).sort((a,b)=>(a.kind==='logo'?-1:0)-(b.kind==='logo'?-1:0)||a.path.localeCompare(b.path));if(!assets.length)throw new Error('No image assets found');}catch(e){assets=known.map(path=>({path,name:path.split('/').pop(),kind:classify(path)}));$('count').textContent='Showing built-in image index · live repository scan unavailable ('+e.message+')'}render()}
$('search').addEventListener('input',render);$('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});$('grid').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy URL',1200)}catch{window.open(b.dataset.copy,'_blank','noopener')}});load();
})();
</script></body></html>
