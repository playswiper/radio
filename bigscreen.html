<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/FalviconMainImage.jpeg?v=20261119-1">
<link rel="shortcut icon" type="image/jpeg" href="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/FalviconMainImage.jpeg?v=20261119-1">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/FalviconMainImage.jpeg?v=20261119-1"><title>Swiper Radio Big Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--panel2:#0c1118;--line:#273342;--muted:#8d9aaa;--blue:#7eb5ff;--gold:#f4c96b;--green:#8bd6b1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#182638 0,transparent 55%),var(--bg);color:#f6f8fb;font-family:Fredoka,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#18212d;color:#f7f9fc;border-radius:13px;padding:11px 15px;transition:.2s}button:hover{border-color:#6485a8;background:#202d3d;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.wrap{max-width:1440px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;flex:0 0 43px;border-radius:14px;object-fit:cover;border:1px solid #34465b;box-shadow:0 8px 30px #0005}.brand h1{font-size:23px;margin:0;letter-spacing:.2px}.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}.status{font-size:12px;color:var(--green);border:1px solid #315344;background:#12231d;border-radius:30px;padding:8px 12px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.panel{background:linear-gradient(160deg,#121923,#0d1219);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 60px #0003}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#8fa0b3;text-transform:uppercase}
.playerbox{position:relative;max-width:960px;width:100%;margin:0 auto;overflow:hidden;border-radius:16px;background:#05070a;aspect-ratio:16/9;min-height:360px;display:grid;place-items:center;border:1px solid #253243}.playerbox iframe{width:100%;height:100%;border:0}.playerbox audio{display:none}.playerplaceholder{z-index:2}.playerplaceholder img{width:min(48%,360px);max-height:48vh;aspect-ratio:1;object-fit:cover;border-radius:24px}.playerbox{aspect-ratio:auto;min-height:min(65vh,720px)}.playerplaceholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#8392a4;font-size:14px;font-weight:600;letter-spacing:.4px;background:radial-gradient(circle at center,#172638 0,transparent 62%);pointer-events:none}.playerplaceholder img{width:min(34%,210px);aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid #344b65;box-shadow:0 18px 60px #0008}.playerplaceholder span{max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now{display:flex;gap:14px;align-items:center;justify-content:center;margin:16px auto;max-width:620px}.cover{width:88px;height:88px;flex:0 0 88px;border-radius:14px;object-fit:cover;background:#202a37}.songtitle{font-size:25px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);margin-top:3px;font-size:14px}.controls{display:none!important}.playback-state{text-align:center;color:#9aa9b9;font-size:13px;margin-top:12px;letter-spacing:.08em;text-transform:uppercase}.primary{background:#dcecff;color:#101a28;border-color:#dcecff;font-weight:700}.primary:hover{background:#fff;color:#101a28}.progress{margin:12px 0 4px;height:5px;background:#293544;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7bb6ff,#c2ddff);border-radius:9px}.time{display:flex;justify-content:space-between;color:#8998a9;font-size:11px;font-variant-numeric:tabular-nums}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}.requestrow{display:flex;gap:8px}.requestrow select,.requestrow input{min-width:0;flex:1;background:#0a1017;border:1px solid var(--line);color:white;border-radius:12px;padding:11px}.tracklist,.queue{display:grid;gap:7px;max-height:480px;overflow:auto;padding-right:3px}.track{display:flex;align-items:center;gap:10px;padding:8px;border-radius:13px;background:#0b1118;border:1px solid #202c39}.track img{width:44px;height:44px;border-radius:9px;object-fit:cover}.trackinfo{min-width:0;flex:1}.trackinfo strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trackinfo small{color:var(--muted);font-size:11px}.track button{padding:7px 10px;font-size:12px}.queueitem{display:flex;justify-content:space-between;gap:10px;padding:10px;background:#0b1118;border:1px solid #202c39;border-radius:12px;font-size:13px}.queueitem small{display:block;color:var(--muted);margin-top:3px}.empty{color:#8391a1;font-size:13px;padding:15px;text-align:center;border:1px dashed #2a3746;border-radius:13px}.notice{color:#92a2b4;font-size:12px;line-height:1.5;margin:12px 0 0}.notice a{color:#a9ccf4}.search{width:100%;background:#0a1017;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px}.skipline{display:flex;align-items:center;gap:10px;margin-left:0;color:#9aa9b9;font-size:12px}.footer{text-align:center;color:#657487;font-size:11px;margin-top:22px}.footer a{color:#a9ccf4;text-decoration:none}.footer a:hover{text-decoration:underline}
@media(max-width:760px){.wrap{padding:16px 12px 40px}main{grid-template-columns:1fr}.side{grid-template-columns:1fr}.panel{padding:14px}.playerbox{min-height:190px}.top{margin-bottom:15px}.brand h1{font-size:20px}.now{margin:12px 0}.songtitle{font-size:18px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/RadioMusicIcon.svg" alt="Swiper Radio"><div><h1>Swiper Radio</h1><p></p></div></div><div class="status" id="connection">Connecting…</div></header>
<main>
<section class="panel">
<div class="sectionhead"><div><div class="eyebrow"></div><h2>Now playing</h2></div><span class="eyebrow" id="liveLabel"></span></div>
<div class="playerbox" id="playerbox"><div class="playerplaceholder" id="playerplaceholder"><img id="stageArtwork" src="https://raw.githubusercontent.com/playswiper/Swiper/main/Images/RadioMusicIcon.svg" alt="Swiper Radio music icon"><span id="stageTitle">Loading global audio…</span></div><audio id="radioAudio" preload="none" playsinline></audio></div>
<div class="now"><div style="min-width:0;flex:1"><div class="songtitle" id="songtitle">Loading station…</div><div class="artist" id="artist">Getting the current song</div></div></div>
<div class="progress"><span id="progressbar"></span></div><div class="time"><span id="elapsed">0:00</span><span id="remaining">-0:00 left - 0:00</span></div>
<div class="playback-state" id="playState">Connecting to live radio…</div>
<p class="notice">LIVE RADIO - SYNCHRONIZED PLAYBACK</p>
</section>
</main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://upghyzhawctughyojwpo.supabase.co',SUPABASE_KEY='sb_publishable_z70GOIzu3F_xdxdJiVa48A_SqvrA6-b',AUDIUS='https://api.audius.co/v1',APP='SwiperRadio';
const $=id=>document.getElementById(id),db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),audio=$('radioAudio');
let station=null,currentTrack=null,localPlaying=false,lastDriftCheck=0;
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function setStatus(t,ok=true){$('connection').textContent=(ok?' ':' ')+t;$('connection').style.color=ok?'var(--green)':'#e5b37d';$('playState').textContent=t}
function elapsed(){return station?.started_at?Math.max(0,(Date.now()-new Date(station.started_at).getTime())/1000):0}
function art(t){const a=t?.artwork_url;return typeof a==='string'?a:(a?.['480x480']||a?.['150x150']||a?.['1000x1000']||'')}
function artist(t){return t?.user?.name||t?.artist||'Unknown artist'}
function normalize(t){return {provider_track_id:String(t.id),title:t.title||'Untitled',artist:artist(t),artwork_url:art(t),duration_seconds:Math.max(1,Math.round(Number(t.duration)||180))}}
async function audius(path){const r=await fetch(AUDIUS+path+(path.includes('?')?'&':'?')+'app_name='+APP);if(!r.ok)throw new Error('Audius request failed ('+r.status+')');const j=await r.json();return j.data||[]}
async function register(t){const x=normalize(t),{data,error}=await db.rpc('radio_register_audius_track',{p_provider_track_id:x.provider_track_id,p_title:x.title,p_artist:x.artist,p_artwork_url:x.artwork_url,p_duration_seconds:x.duration_seconds});if(error)throw error;return {...x,id:data,provider:'audius',stream_url:'https://api.audius.co/v1/tracks/'+encodeURIComponent(x.provider_track_id)+'/stream?app_name='+APP}}
async function bootstrap(){const {data:st}=await db.from('radio_station').select('current_track_id').eq('id',1).maybeSingle();if(st?.current_track_id){const {data:cur}=await db.from('radio_tracks').select('provider').eq('id',st.current_track_id).maybeSingle();if(cur?.provider==='audius')return}let trending=await audius('/tracks/trending?time=week&limit=30');if(!trending.length)trending=await audius('/tracks/trending?limit=30');let first=null;for(const t of trending){try{const saved=await register(t);if(!first)first=saved}catch(e){console.warn('Could not register Audius song',e)}}if(first){const {error}=await db.rpc('radio_switch_to_audius',{p_track_id:first.id});if(error)console.warn('Station bootstrap:',error.message)}}
function renderTrack(){if(!currentTrack)return;const art=currentTrack.artwork_url||'https://raw.githubusercontent.com/playswiper/Swiper/main/Images/RadioMusicIcon.svg';$('songtitle').textContent=currentTrack.title;$('artist').textContent=currentTrack.artist;$('stageArtwork').src=art;$('stageArtwork').onerror=()=>{$('stageArtwork').onerror=null;$('stageArtwork').src='https://raw.githubusercontent.com/playswiper/Swiper/main/Images/RadioMusicIcon.svg'};$('stageTitle').textContent=currentTrack.title+' - '+currentTrack.artist}
function playAtSharedTime(){if(!currentTrack||!station)return;const src='https://api.audius.co/v1/tracks/'+encodeURIComponent(currentTrack.provider_track_id)+'/stream?app_name='+APP;const expected=Math.floor(elapsed());if(audio.dataset.track!==currentTrack.id){audio.pause();audio.dataset.track=currentTrack.id;audio.src=src;audio.load();audio.onloadedmetadata=async()=>{try{if(Number.isFinite(audio.duration)&&expected<audio.duration-2)audio.currentTime=expected;await audio.play()}catch(e){localPlaying=false;$('playState').textContent='Audio waiting for browser permission';setStatus('Tap the main Swiper player once to enable audio',false)}}}else{try{if(audio.readyState>=1&&Math.abs(audio.currentTime-expected)>3)audio.currentTime=expected;audio.play().catch(()=>{localPlaying=false;$('playState').textContent='Audio waiting for browser permission';setStatus('Enable audio from the main Swiper player',false)})}catch{}}}
async function loadStation(force=false){const {data:s,error}=await db.from('radio_station').select('*').eq('id',1).maybeSingle();if(error)throw error;if(!s)return;const changed=!station||station.current_track_id!==s.current_track_id;station=s;if(changed||force){if(s.current_track_id){const {data:t,error:te}=await db.from('radio_tracks').select('*').eq('id',s.current_track_id).maybeSingle();if(te)throw te;currentTrack=t;if(t?.provider==='audius'){renderTrack();playAtSharedTime()}else{$('songtitle').textContent='Switching to Audius…';$('artist').textContent='Loading the radio'}}}updateClock()}
async function advanceFinished(){if(!currentTrack||advancingTrackId===currentTrack.id)return;const id=currentTrack.id;advancingTrackId=id;try{const {error}=await db.rpc('radio_advance_station',{p_expected_track_id:id});if(error)throw error;await loadStation(true)}catch(e){setStatus(e.message,false)}finally{if(advancingTrackId===id)advancingTrackId=null}}
function updateClock(){if(!currentTrack)return;const d=Math.max(1,Number(currentTrack.duration_seconds)||180),raw=localPlaying&&Number.isFinite(audio.currentTime)?audio.currentTime:elapsed(),e=Math.min(d,Math.max(0,raw));$('elapsed').textContent=fmt(e);$('remaining').textContent=fmt(d)+' total';$('progressbar').style.width=(Math.min(100,e/d*100))+'%';if(raw>=d)advanceFinished()}
audio.addEventListener('play',()=>{localPlaying=true;$('playState').textContent='LIVE - PLAYING'});audio.addEventListener('pause',()=>{localPlaying=false;$('playState').textContent='LIVE - SYNCING'});audio.addEventListener('ended',()=>advanceFinished());audio.addEventListener('error',()=>setStatus('Audius stream unavailable for this track',false));



async function start(){try{setStatus('Connecting to Audius…');await bootstrap();await loadStation(true);db.channel('radio-live').on('postgres_changes',{event:'*',schema:'public',table:'radio_station'},()=>loadStation().catch(console.error)).subscribe(s=>{if(s==='SUBSCRIBED')setStatus('Audius station connected');if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')setStatus('Reconnecting…',false)})}catch(e){console.error(e);setStatus('Connection issue: '+e.message,false);$('songtitle').textContent='Could not load Audius station';$('artist').textContent='Check your connection and retry'}} 
setInterval(()=>{updateClock();if(station&&currentTrack&&Date.now()-lastDriftCheck>8000){lastDriftCheck=Date.now();const expected=elapsed();if(audio.readyState>=1&&Math.abs(audio.currentTime-expected)>3)audio.currentTime=expected}},1000);
start();setInterval(()=>loadStation().catch(e=>console.warn('Station refresh failed',e)),5000);
})();
</script></body></html>
