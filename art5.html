<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Swiper Radio · Cyber Pulse</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--a:#65e8f0;--b:#12353a;--glow:#43d7e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,var(--b),#080b10 68%);font-family:Fredoka,sans-serif;color:#f5f7fb;padding:20px}.stage{width:min(100%,620px);text-align:center}.label{color:#8594a7;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:26px}.open{position:relative;margin:auto;display:flex;align-items:center;justify-content:center;gap:15px;width:230px;height:94px;border:1px solid color-mix(in srgb,var(--a),transparent 45%);background:linear-gradient(145deg,var(--b),#0d1219);color:white;border-radius:999px;box-shadow:0 12px 42px #0008,0 0 28px color-mix(in srgb,var(--glow),transparent 83%);cursor:pointer;overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1),height .45s,box-shadow .35s,transform .35s,border-radius .35s}.open:hover,.open:focus-visible{width:min(100%,470px);height:174px;border-radius:22px;transform:translateY(-5px);box-shadow:0 22px 65px #0009,0 0 40px color-mix(in srgb,var(--glow),transparent 58%);outline:none}.orb{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#09111b;font-size:23px;box-shadow:0 0 25px color-mix(in srgb,var(--glow),transparent 30%);transition:.4s}.open:hover .orb{transform:rotate(18deg) scale(1.12)}.buttonword{font-size:22px;font-weight:600;white-space:nowrap}.detail{position:absolute;left:22px;right:22px;bottom:17px;opacity:0;transform:translateY(12px);transition:.35s .08s;pointer-events:none;text-align:left}.open:hover .detail,.open:focus-visible .detail{opacity:1;transform:translateY(0)}.songrow{display:flex;align-items:center;gap:12px}.art{width:46px;height:46px;object-fit:cover;border-radius:10px;background:#27313e}.meta{min-width:0;flex:1}.title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:#a3afbd;margin-top:2px}.duration{font-size:11px;color:#aab7c7;white-space:nowrap;font-variant-numeric:tabular-nums}.bar{height:3px;background:#344150;border-radius:5px;margin-top:11px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--a);box-shadow:0 0 12px var(--glow)}.times{display:flex;justify-content:space-between;color:#9aa8b7;font-size:10px;margin-top:5px}.caption{margin-top:28px;color:#8391a2;font-size:13px}.back{display:inline-block;margin-top:22px;color:#9ecaff;text-decoration:none;font-size:13px}.open:before{content:"";position:absolute;inset:-80% -30%;background:linear-gradient(110deg,transparent 42%,#ffffff18 50%,transparent 58%);transform:translateX(-60%) rotate(12deg);transition:transform .8s}.open:hover:before{transform:translateX(60%) rotate(12deg)}@media(max-width:480px){.open{width:220px}.open:hover,.open:focus-visible{width:100%}.detail{left:14px;right:14px}.duration{font-size:10px}}
</style></head><body><main class="stage"><div class="label">Swiper Radio · Button concept 5 / 10</div><button class="open" id="open" type="button" aria-label="Open Swiper Radio"><span class="orb">▶</span><span class="buttonword">Open Radio</span><span class="detail"><span class="songrow"><img class="art" id="art" alt=""><span class="meta"><span class="title" id="title">Loading live track…</span><span class="artist" id="artist">Swiper Radio</span></span><span class="duration" id="duration">--:-- left</span></span><span class="bar"><span id="bar"></span></span><span class="times"><span id="elapsed">0:00</span><span id="total">0:00 total</span></span></span></button><div class="caption">Cyber Pulse · Hover or focus the button to reveal live song details.</div><a class="back" href="index.html">← Back to Swiper Radio</a></main>
<script>(()=>{const URL='https://upghyzhawctughyojwpo.supabase.co',KEY='sb_publishable_z70GOIzu3F_xdxdJiVa48A_SqvrA6-b';let track=null,started=null;const $=id=>document.getElementById(id),fmt=n=>Math.floor(Math.max(0,n)/60)+':'+String(Math.floor(Math.max(0,n)%60)).padStart(2,'0');async function refresh(){try{const headers={apikey:KEY,Authorization:'Bearer '+KEY};const s=await fetch(URL+'/rest/v1/radio_station?select=current_track_id,started_at&id=eq.1',{headers}).then(r=>r.json());if(!s[0])return;started=s[0].started_at;const t=await fetch(URL+'/rest/v1/radio_tracks?select=*&id=eq.'+s[0].current_track_id,{headers}).then(r=>r.json());if(!t[0])return;track=t[0];$('title').textContent=track.title;$('artist').textContent=track.artist;$('art').src=track.artwork_url||'';$('total').textContent=fmt(track.duration_seconds)+' total'}catch(e){$('title').textContent='Live track unavailable'}}function clock(){if(!track||!started)return;const e=Math.max(0,(Date.now()-new Date(started).getTime())/1000),d=track.duration_seconds||0;$('elapsed').textContent=fmt(e);$('duration').textContent=fmt(Math.max(0,d-e))+' left';$('bar').style.width=(d?Math.min(100,e/d*100):0)+'%'}$('open').addEventListener('click',()=>location.href='index.html');refresh().then(clock);setInterval(()=>refresh().then(clock),15000);setInterval(clock,1000)})();</script></body></html>
